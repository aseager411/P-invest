<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <h1 id = "create-header">Preferences<h1>
    <h2 class = "small-headers">Age</h2>

    <div class="range-wrapper">
        <fieldset class="range__field">
            <input class="range" type="range" min="0" max="4">
            <svg role="presentation" width="100%" height="10" xmlns="http://www.w3.org/2000/svg">
               <rect class="range__tick" x="0%" y="3" width="1" height="10"></rect>
               <rect class="range__tick" x="25%" y="3" width="1" height="10"></rect>
               <rect class="range__tick" x="50%" y="3" width="1" height="10"></rect>
               <rect class="range__tick" x="75%" y="3" width="1" height="10"></rect>
               <rect class="range__tick" x="100%" y="3" width="1" height="10"></rect>
              
            </svg>
            <svg role="presentation" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
               <text class="range__point" x="0%" y="24" text-anchor="start">18-22</text>
               <text class="range__point" x="25%" y="24" text-anchor="middle">23-29</text>
               <text class="range__point" x="50%" y="24" text-anchor="middle">30-40</text>
               <text class="range__point" x="75%" y="24" text-anchor="middle">40-50</text>
               <text class="range__point" x="98%" y="24" text-anchor="middle">50+</text>

            </svg>
         </fieldset>
         </div>
			
         <h2 class = "small-headers">Annual Income</h2>

         <div class="range-wrapper">
             <fieldset class="range__field">
                 <input class="range" type="range" min="0" max="4">
                 <svg role="presentation" width="100%" height="10" xmlns="http://www.w3.org/2000/svg">
                    <rect class="range__tick" x="0%" y="3" width="1" height="10"></rect>
                    <rect class="range__tick" x="25%" y="3" width="1" height="10"></rect>
                    <rect class="range__tick" x="50%" y="3" width="1" height="10"></rect>
                    <rect class="range__tick" x="75%" y="3" width="1" height="10"></rect>
                    <rect class="range__tick" x="100%" y="3" width="1" height="10"></rect>
                   
                 </svg>
                 <svg role="presentation" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
                    <text class="range__point" x="0%" y="24" text-anchor="start"> < $20,000 </text>
                    <text class="range__point" x="25%" y="24" text-anchor="middle"> $20,000-$50,000 </text>
                    <text class="range__point" x="50%" y="24" text-anchor="middle">$50,000-$90,000</text>
                    <text class="range__point" x="75%" y="24" text-anchor="middle"> $90,000-$150,000 </text>
                    <text class="range__point" x="93%" y="24" text-anchor="middle"> > $150,000 </text>
     
                 </svg>
              </fieldset>
              </div>

              <h2 class = "small-headers">Savings</h2>

              <div class="range-wrapper">
                  <fieldset class="range__field">
                      <input class="range" type="range" min="0" max="4">
                      <svg role="presentation" width="100%" height="10" xmlns="http://www.w3.org/2000/svg">
                         <rect class="range__tick" x="0%" y="3" width="1" height="10"></rect>
                         <rect class="range__tick" x="25%" y="3" width="1" height="10"></rect>
                         <rect class="range__tick" x="50%" y="3" width="1" height="10"></rect>
                         <rect class="range__tick" x="75%" y="3" width="1" height="10"></rect>
                         <rect class="range__tick" x="100%" y="3" width="1" height="10"></rect>
                        
                      </svg>
                      <svg role="presentation" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
                         <text class="range__point" x="0%" y="24" text-anchor="start"> < $5,000 </text>
                         <text class="range__point" x="25%" y="24" text-anchor="middle"> $5,000-$15,000 </text>
                         <text class="range__point" x="50%" y="24" text-anchor="middle">$15,000-$40,000</text>
                         <text class="range__point" x="75%" y="24" text-anchor="middle"> $40,000-$140,000 </text>
                         <text class="range__point" x="93%" y="24" text-anchor="middle"> > $140,000 </text>
          
                      </svg>
                   </fieldset>
                   </div>
      <h2 class = "small-headers">Risk Tolerance</h2>
      <h2 class = "smaller-headers">1 = Lowest risk, 5 = Highest risk </h2>

                   <div class="range-wrapper">
                       <fieldset class="range__field">
                           <input class="range" type="range" min="0" max="4">
                           <svg role="presentation" width="100%" height="10" xmlns="http://www.w3.org/2000/svg">
                              <rect class="range__tick" x="0%" y="3" width="1" height="10"></rect>
                              <rect class="range__tick" x="25%" y="3" width="1" height="10"></rect>
                              <rect class="range__tick" x="50%" y="3" width="1" height="10"></rect>
                              <rect class="range__tick" x="75%" y="3" width="1" height="10"></rect>
                              <rect class="range__tick" x="100%" y="3" width="1" height="10"></rect>
                             
                           </svg>
                           <svg role="presentation" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
                              <text class="range__point" x="0%" y="24" text-anchor="start"> 1  </text>
                              <text class="range__point" x="25%" y="24" text-anchor="middle"> 2 </text>
                              <text class="range__point" x="50%" y="24" text-anchor="middle">3</text>
                              <text class="range__point" x="75%" y="24" text-anchor="middle"> 4 </text>
                              <text class="range__point" x="99%" y="24" text-anchor="middle"> 5 </text>
               
                           </svg>
                        </fieldset>
                        </div>
         <h2 class = "small-headers">Time Horizon</h2>
         <h2 class = "smaller-headers"> When you expect to withdraw investments</h2>
                  
                                     <div class="range-wrapper">
                                         <fieldset class="range__field">
                                             <input class="range" type="range" min="0" max="4">
                                             <svg role="presentation" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
                                                <rect class="range__tick" x="0%" y="3" width="1" height="10"></rect>
                                                <rect class="range__tick" x="25%" y="3" width="1" height="10"></rect>
                                                <rect class="range__tick" x="50%" y="3" width="1" height="10"></rect>
                                                <rect class="range__tick" x="75%" y="3" width="1" height="10"></rect>
                                                <rect class="range__tick" x="100%" y="3" width="1" height="10"></rect>
                                               
                                             </svg>
                                             <svg role="presentation" width="100%" height="35" xmlns="http://www.w3.org/2000/svg">
                                                <text class="range__point" x="0%" y="28" text-anchor="start"> >10 years  </text>
                                                <text class="range__point" x="25%" y="24" text-anchor="middle"> 5-10 years </text>
                                                <text class="range__point" x="50%" y="24" text-anchor="middle">3-5 years</text>
                                                <text class="range__point" x="75%" y="24" text-anchor="middle"> 1-3 years </text>
                                                <text class="range__point" x="95%" y="24" text-anchor="middle"> < 1 year </text>
                                 
                                             </svg>
                                          </fieldset>
                                          </div>
         
      <button id = "next" type = "submit" onclick="chatbot()">Next</button>
                                 
        <script src="script.js"></script>

    </body>
</html>
