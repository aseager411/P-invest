<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>p-invest</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <div>
      <!-- Header row -->
      <div class="chatbot-header-container">
        <!-- Centered logo and text -->
        <div class="chatbot-center-container">
          <img src="./logo.png" alt="Logo" class="chatbot-logo-img" />
          <h2 class="chatbot-header-text">AI Chat Bot</h2>
        </div>

        <!-- Popup container aligned to the right -->
        <div class="chatbot-popup-container">
          <button class="chatbot-button" onclick="togglePopup()">
            <img src="./user.png" alt="User Icon" class="chatbot-user-img" />
          </button>
          <div class="chatbot-popup" id="settingsPopup" style="display: none">
            <div class="chatbot-popup-content">
              <div class="chatbot-popup-name">John Smith</div>
              <div class="chatbot-gradient-bar"></div>
              <div class="chatbot-popup-buttons">
                <a href="settings.html"><button>Account Settings</button></a>
                <a href="user_preferences.html"
                  ><button>User Preferences</button></a
                >
                <a href="investment.html"><button>My Investments</button></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Search bar section -->
      <p class="chatbot-bold-text">Welcome to</p>
      <p class="chatbot-italic-text">Fidelity +</p>
      <textarea class="chatbot-input" placeholder="Ask anything"></textarea>

      <!-- Sector options -->
      <div class="chatbot-options">
        <button class="commodities">Commodities</button>
        <button class="technology">Technology</button>
        <button class="healthcare">Healthcare</button>
        <button class="crypto">Crypto</button>
      </div>
    </div>

    <script>
      function togglePopup() {
        const popup = document.getElementById("settingsPopup");
        popup.style.display = popup.style.display === "none" ? "block" : "none";
      }
    </script>
    <script src="script.js"></script>
  </body>
</html>
