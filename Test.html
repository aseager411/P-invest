<!DOCTYPE html>
<html>
<body>
    <h2>Risk Tolerance</h2>
    <input type="range" min="1" max="10" value="8" id="slider" style="width: 200px">
    <div>Value: <span id="value">8</span></div>
    <button onclick="save()">Save</button>
    <div id="status"></div>

<script>
// Load initial value
(async () => {
    try {
        const res = await fetch('/api/risk-tolerance')
        const {value} = await res.json()
        slider.value = value
        value.textContent = value
    } catch(e) {
        status.textContent = 'Error loading'
    }
})()

// Update display while sliding
slider.oninput = () => value.textContent = slider.value

// Save function
async function save() {
    try {
        const res = await fetch('/api/risk-tolerance', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: +slider.value})
        })
        status.textContent = res.ok ? 'Saved!' : 'Error saving'
    } catch(e) {
        status.textContent = 'Failed to save'
    }
}
</script>
</body>
</html>
